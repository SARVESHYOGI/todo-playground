[project]
name = "app"
version = "0.1.0"
description = "FastAPI backend for the todo app"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi[standard]>=0.115,<1.0.0",
    "sqlmodel>=0.0.22,<1.0.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2.1,<3.0.0",
    "email-validator>=2.1.0.post1",
    "pyjwt>=2.8.0,<3.0.0",
    "pwdlib[argon2]>=0.2.0,<1.0.0",
    "psycopg[binary]>=3.2,<4.0.0",
    "alembic>=1.13,<2.0.0",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<10.0.0",
    "httpx>=0.27,<1.0.0",
    "ruff>=0.6,<1.0.0",
    "mypy>=1.11,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG001", "T201"]
ignore = ["E501", "B008", "B904"]

[tool.mypy]
strict = true
